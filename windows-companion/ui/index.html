<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Judge.Me — Koneksi ChatGPT</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#17211c;background:#f4f7f5}body{margin:0;padding:28px}
main{max-width:480px;margin:auto;background:white;border:1px solid #dce5df;border-radius:16px;padding:24px;box-shadow:0 8px 28px #153b2412}
h1{font-size:22px;margin:0 0 8px}p{color:#53635a;line-height:1.5}.status{padding:14px;border-radius:10px;background:#f1f5f2;margin:18px 0}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}
.primary{background:#087a4a;color:white}.secondary{background:#e8efeb;color:#193c2b}.muted{font-size:12px;color:#64736a;margin-top:20px}
</style></head><body><main>
<h1>Judge.Me — Koneksi ChatGPT</h1>
<p>Hubungkan akun ChatGPT Anda melalui alur resmi. Login dibuka di browser Windows; kredensial disimpan melalui penyimpanan terlindungi Windows.</p>
<div class="status" id="status">Memeriksa status koneksi…</div>
<button class="primary" id="connect">Hubungkan Akun ChatGPT</button>
<button class="secondary" id="refresh">Perbarui Status</button>
<button class="secondary" id="disconnect">Putuskan Koneksi</button>
<button class="secondary" id="usage">Kelola Penggunaan</button>
<p class="muted">Aplikasi ini belum mengirim dokumen perkara. Transfer kredensial ke server Judge.Me belum diaktifkan.</p>
</main><script src="./renderer.js"></script></body></html>
